[package]
name = "the-office"
version = "2.1.0"
edition = "2021"
description = "The Office - dashboard personale sul vault Obsidian"

[[bin]]
name = "TheOffice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
notify = "6"
percent-encoding = "2"
url = "2"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
